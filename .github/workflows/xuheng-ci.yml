name: Xuheng Extension Checks

on:
  push:
  pull_request:

jobs:
  review-extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-tested.txt
      - name: Install tested backend dependencies
        run: python -m pip install -r requirements.txt -c requirements-tested.txt
      - name: Check development progress board
        run: python scripts/sync_progress.py --check
      - name: Check review behavior and upstream integration boundaries
        run: python -m pytest tests/unit -q
      - name: Reproduce the offline rule evaluation
        run: python scripts/evaluation/evaluate_xuheng.py --output scripts/evaluation/results/xuheng.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the browser workbench
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install browser for UI regression
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser regression
        working-directory: frontend
        env:
          XUHENG_TEST_PYTHON: python
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:e2e
      - name: Build and inspect the delivery archive
        run: python scripts/package_xuheng.py
      - name: Start and restore the unpacked browser edition
        shell: bash
        run: python scripts/smoke_xuheng_package.py .release/Xuheng-browser-*.zip
